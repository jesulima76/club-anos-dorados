<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Actividades | Club de Los Años Dorados</title>
  <meta name="description" content="Catálogo de las 76 actividades recreativas, espirituales y de desarrollo personal del Club de Los Años Dorados.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: 'Open Sans', system-ui, sans-serif;
      color: #2b2b2b;
      background: #fdfaf4;
      line-height: 1.6;
    }
    :root {
      --primary: #c85a17;
      --primary-dark: #a14410;
      --cream: #fdfaf4;
      --ink: #2b2b2b;
      --muted: #6a6a6a;
      --card-bg: #ffffff;
      --border: #eadfcd;
      --shadow: 0 6px 24px rgba(0,0,0,.08);
      --radius: 14px;
    }
    h1,h2,h3,h4 { font-family: 'Merriweather', serif; line-height: 1.25; margin: 0 0 .5em; }
    p { margin: 0 0 1em; }
    img { max-width: 100%; display: block; }
    .container { width: min(1180px, 92%); margin-inline: auto; }

    .btn {
      display: inline-block;
      padding: .75rem 1.4rem;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform .15s ease, background .2s ease, color .2s ease;
      font-size: .95rem;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline { border-color: var(--primary); color: var(--primary); background: transparent; }
    .btn-outline:hover { background: var(--primary); color: #fff; }

    .page-header {
      background: #fff; border-bottom: 1px solid var(--border);
      padding: 1rem 0; position: sticky; top: 0; z-index: 50;
    }
    .page-header-inner { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    .brand { display: flex; align-items: center; gap: .75rem; }
    .brand-icon { font-size: 2rem; }
    .brand h1 { font-size: 1.2rem; margin: 0; }
    .brand p { margin: 0; font-size: .8rem; color: var(--muted); }

    .filters {
      background: #fff; padding: 1.2rem 0;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 64px; z-index: 40;
      box-shadow: 0 2px 6px rgba(0,0,0,.03);
    }
    .filters-inner { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
    .chip {
      border: 1px solid var(--border); background: #fff; color: var(--ink);
      padding: .5rem 1rem; border-radius: 999px; cursor: pointer; font-size: .9rem;
      font-weight: 600; transition: all .2s ease;
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .search-box {
      margin-left: auto; border: 1px solid var(--border); border-radius: 999px;
      padding: .5rem 1rem; font-size: .9rem; min-width: 220px; outline: none;
    }
    .search-box:focus { border-color: var(--primary); }

    .catalog { padding: 2.5rem 0; }
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }
    .activity-card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      cursor: pointer; transition: transform .2s ease, box-shadow .2s ease;
      display: flex; flex-direction: column;
    }
    .activity-card:hover { transform: translateY(-4px); box-shadow: var(--shadow); }
    .activity-thumb {
      aspect-ratio: 16/10; background: #f5eee2;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
    }
    .activity-body { padding: 1rem 1.1rem 1.2rem; flex: 1; display: flex; flex-direction: column; }
    .activity-cat {
      font-size: .72rem; text-transform: uppercase; font-weight: 700;
      letter-spacing: .05em; color: var(--primary); margin-bottom: .35rem;
    }
    .activity-title { font-family: 'Merriweather', serif; font-size: 1.05rem; margin: 0 0 .5rem; }
    .activity-num {
      font-size: .75rem; color: var(--muted); margin-top: auto;
      background: #f5eee2; align-self: flex-start; padding: .2rem .6rem; border-radius: 999px;
    }
    .empty-state {
      grid-column: 1 / -1; text-align: center; padding: 3rem 1rem; color: var(--muted);
    }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.55);
      display: none; align-items: flex-start; justify-content: center;
      padding: 2rem 1rem; z-index: 100; overflow-y: auto;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff; border-radius: var(--radius); width: min(820px, 100%);
      padding: 2rem; position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.3);
      animation: slideUp .25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-close {
      position: absolute; top: 1rem; right: 1rem;
      border: none; background: #f5eee2; width: 40px; height: 40px;
      border-radius: 50%; font-size: 1.3rem; cursor: pointer; color: var(--ink);
      transition: background .2s;
    }
    .modal-close:hover { background: var(--border); }
    .modal-cat {
      display: inline-block; font-size: .75rem; text-transform: uppercase; font-weight: 700;
      color: var(--primary); letter-spacing: .05em; margin-bottom: .5rem;
    }
    .modal-title { font-size: 1.6rem; margin-bottom: 1rem; padding-right: 2.5rem; }
    .modal-section { margin-bottom: 1.2rem; }
    .modal-section h4 {
      font-size: .85rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--primary-dark); margin-bottom: .35rem;
    }
    .modal-section p { margin: 0; color: #3a3a3a; }
    .modal-pasos { margin: 0; padding-left: 1.4rem; color: #3a3a3a; }
    .modal-pasos li { margin-bottom: .45rem; padding-left: .3rem; line-height: 1.55; }
    .modal-pasos li::marker { color: var(--primary); font-weight: 700; }
    .modal-actions {
      display: flex; gap: .75rem; flex-wrap: wrap;
      border-top: 1px solid var(--border); padding-top: 1.2rem; margin-top: 1.2rem;
    }
    .modal-actions .btn { font-size: .9rem; }

    @media (max-width: 860px) {
      .filters { top: 60px; }
      .search-box { width: 100%; margin-left: 0; }
    }
    @media (max-width: 520px) {
      .page-header-inner { flex-direction: column; align-items: flex-start; }
      .modal { padding: 1.5rem 1.2rem; }
      .modal-title { font-size: 1.3rem; }
    }
  </style>
</head>
<body>

  <header class="page-header">
    <div class="container page-header-inner">
      <div class="brand">
        <span class="brand-icon">🌻</span>
        <div>
          <h1>Catálogo de Actividades</h1>
          <p>Club de Los Años Dorados · Los Andes I</p>
        </div>
      </div>
      <a href="index.html" class="btn btn-outline">← Volver al inicio</a>
    </div>
  </header>

  <section class="filters">
    <div class="container filters-inner" id="filters">
      <button class="chip active" data-filter="all">Todas</button>

      <button class="chip" data-filter="desarrollo">🌟 Desarrollo Personal</button>
      <button class="chip" data-filter="artisticas">🎨 Artísticas</button>

    </div>
  </section>

  <main class="catalog">
    <div class="container">
      <div class="catalog-grid" id="catalogGrid"></div>
    </div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" aria-label="Cerrar">✕</button>
      <span class="modal-cat" id="modalCat"></span>
      <h2 class="modal-title" id="modalTitle"></h2>

      <div class="modal-section" id="secObjetivo">
        <h4>🎯 Objetivo de la actividad</h4>
        <p id="modalObjetivo"></p>
      </div>

      <div class="modal-section">
        <h4>📖 Descripción general</h4>
        <p id="modalDetalle"></p>
      </div>

      <div class="modal-section" id="secPasos">
        <h4>🪜 Cómo desarrollarla paso a paso</h4>
        <ol id="modalPasos" class="modal-pasos"></ol>
      </div>

      <div class="modal-section">
        <h4>🧰 Materiales</h4>
        <p id="modalMateriales"></p>
      </div>

      <div class="modal-actions">
        <button class="btn btn-primary" id="btnWord">📄 Descargar en Word</button>
        <button class="btn btn-outline" id="btnPdf">📕 Descargar en PDF</button>
      </div>
    </div>
  </div>

  const state = { filter: 'all', search: '', currentActivity: null };

  function renderGrid() {
    const grid = document.getElementById('catalogGrid');
    const term = state.search.trim().toLowerCase();

    const filtradas = ACTIVIDADES.filter(a => {
      const matchCat = state.filter === 'all' || a.cat === state.filter;
      const matchTxt = !term ||
        a.titulo.toLowerCase().includes(term) ||
        (a.metodo || '').toLowerCase().includes(term);
      return matchCat && matchTxt;
    });

    if (filtradas.length === 0) {
      grid.innerHTML = `<p class="empty-state">No se encontraron actividades con esos criterios.</p>`;
      return;
    }

    grid.innerHTML = filtradas.map(a => `
      <article class="activity-card" data-id="${a.id}" tabindex="0" role="button"
               aria-label="Ver actividad ${a.titulo}">
        <div class="activity-thumb">${a.icono}</div>
        <div class="activity-body">
          <span class="activity-cat">${CATEGORIAS[a.cat].emoji} ${CATEGORIAS[a.cat].nombre}</span>
          <h3 class="activity-title">${a.titulo}</h3>
          <span class="activity-num">Actividad #${a.id}</span>
        </div>
      </article>
    `).join('');

    grid.querySelectorAll('.activity-card').forEach(card => {
      card.addEventListener('click', () => openModal(Number(card.dataset.id)));
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openModal(Number(card.dataset.id));
        }
      });
    });
  }

  document.getElementById('filters').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.filter = chip.dataset.filter;
    renderGrid();
  });

  document.getElementById('searchInput').addEventListener('input', e => {
    state.search = e.target.value;
    renderGrid();
  });

  const backdrop = document.getElementById('modalBackdrop');

  function openModal(id) {
    const a = ACTIVIDADES.find(x => x.id === id);
    if (!a) return;
    state.currentActivity = a;

    document.getElementById('modalCat').textContent =
      `${CATEGORIAS[a.cat].emoji} ${CATEGORIAS[a.cat].nombre}`;
    document.getElementById('modalTitle').textContent = a.titulo;

    const secObj = document.getElementById('secObjetivo');
    if (a.objetivo) {
      secObj.style.display = '';
      document.getElementById('modalObjetivo').textContent = a.objetivo;
    } else {
      secObj.style.display = 'none';
    }

    document.getElementById('modalDetalle').textContent = a.detalle || a.metodo;

    const secPasos = document.getElementById('secPasos');
    const ol = document.getElementById('modalPasos');
    if (Array.isArray(a.pasos) && a.pasos.length > 0) {
      secPasos.style.display = '';
      ol.innerHTML = a.pasos.map(p => `<li>${p}</li>`).join('');
    } else {
      secPasos.style.display = 'none';
      ol.innerHTML = '';
    }

    document.getElementById('modalMateriales').textContent = a.materiales;

    backdrop.classList.add('open');
    backdrop.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeModal() {
    backdrop.classList.remove('open');
    backdrop.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    state.currentActivity = null;
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  backdrop.addEventListener('click', e => { if (e.target === backdrop) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  function exportWord() {
    const a = state.currentActivity;
    if (!a) return;
    const pasosHtml = (a.pasos || []).map(p => `<li>${p}</li>`).join('');
    const objetivoHtml = a.objetivo ? `<h2>Objetivo</h2><p>${a.objetivo}</p>` : '';
    const pasosSec = pasosHtml ? `<h2>Cómo desarrollarla paso a paso</h2><ol>${pasosHtml}</ol>` : '';

    const html = `
      <html xmlns:o="urn:schemas-microsoft-com:office:office"
            xmlns:w="urn:schemas-microsoft-com:office:word"
            xmlns="http://www.w3.org/TR/REC-html40">
      <head>
        <meta charset="utf-8">
        <title>${a.titulo}</title>
        <style>
          @page { size: 21.59cm 33.02cm; margin: 2.5cm; }
          body { font-family: 'Calibri', Arial, sans-serif; font-size: 12pt; color:#222; line-height:1.5; }
          h1 { font-size: 20pt; color:#c85a17; margin-bottom: 4pt; }
          .sub { font-size: 10pt; color:#666; margin-bottom: 6pt; }
          h2 { font-size: 13pt; color:#a14410; margin-top: 18pt; margin-bottom: 6pt;
               border-bottom: 1px solid #eadfcd; padding-bottom: 3pt; }
          p { margin: 0 0 10pt; text-align: justify; }
          ol { margin: 0 0 10pt 18pt; padding: 0; }
          li { margin-bottom: 4pt; text-align: justify; }
          .footer { margin-top: 30pt; font-size: 9pt; color:#888;
                    border-top: 1px solid #ddd; padding-top: 8pt; }
        </style>
      </head>
      <body>
        <h1>${a.titulo}</h1>
        <div class="sub">Club de Los Años Dorados · Conjunto Residencial Los Andes I</div>
        <div class="sub"><b>Categoría:</b> ${CATEGORIAS[a.cat].nombre} &nbsp;·&nbsp; <b>Actividad N.º ${a.id}</b></div>
        ${objetivoHtml}
        <h2>Descripción general</h2>
        <p>${a.detalle || a.metodo}</p>
        ${pasosSec}
        <h2>Materiales necesarios</h2>
        <p>${a.materiales}</p>
        <div class="footer">
          Documento generado desde el catálogo digital del club · Tamaño Oficio (21.59 × 33.02 cm)
        </div>
      </body>
      </html>
    `;

    const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `Actividad_${a.id}_${slugify(a.titulo)}.doc`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  }

  function exportPdf() {
    const a = state.currentActivity;
    if (!a) return;
    const pasosHtml = (a.pasos || []).map(p => `<li>${p}</li>`).join('');
    const objetivoHtml = a.objetivo ? `<h2>Objetivo</h2><p>${a.objetivo}</p>` : '';
    const pasosSec = pasosHtml ? `<h2>Cómo desarrollarla paso a paso</h2><ol>${pasosHtml}</ol>` : '';

    const win = window.open('', '_blank', 'width=900,height=700');
    win.document.write(`
      <html>
      <head>
        <meta charset="utf-8">
        <title>${a.titulo}</title>
        <style>
          @page { size: 21.59cm 33.02cm; margin: 2.5cm; }
          body { font-family: 'Georgia', 'Times New Roman', serif; font-size:12pt; color:#222; line-height:1.55; }
          h1 { font-size: 20pt; color:#c85a17; margin:0 0 4pt; }
          .sub { font-size: 10pt; color:#666; margin-bottom: 6pt; }
          h2 { font-size: 13pt; color:#a14410; margin-top: 18pt;
               border-bottom: 1px solid #eadfcd; padding-bottom: 3pt; }
          p { margin: 0 0 10pt; text-align: justify; }
          ol { margin: 0 0 10pt 18pt; padding: 0; }
          li { margin-bottom: 4pt; text-align: justify; }
          .footer { margin-top: 30pt; font-size: 9pt; color:#888;
                    border-top: 1px solid #ddd; padding-top: 8pt; }
          @media print { .no-print { display: none; } body { margin: 0; } }
          .print-bar {
            background: #c85a17; color:#fff; padding: 10px 16px;
            font-family: sans-serif; font-size: 13px;
            display: flex; justify-content: space-between; align-items: center;
          }
          .print-bar button {
            background:#fff; color:#c85a17; border:none; padding:8px 16px;
            border-radius: 6px; cursor:pointer; font-weight:600;
          }
        </style>
      </head>
      <body>
        <div class="print-bar no-print">
          <span>Vista previa · Se abrirá el diálogo de impresión</span>
          <button onclick="window.print()">🖨️ Imprimir / Guardar como PDF</button>
        </div>
        <br>
        <h1>${a.titulo}</h1>
        <div class="sub">Club de Los Años Dorados · Conjunto Residencial Los Andes I</div>
        <div class="sub"><b>Categoría:</b> ${CATEGORIAS[a.cat].nombre} &nbsp;·&nbsp; <b>Actividad N.º ${a.id}</b></div>
        ${objetivoHtml}
        <h2>Descripción general</h2>
        <p>${a.detalle || a.metodo}</p>
        ${pasosSec}
        <h2>Materiales necesarios</h2>
        <p>${a.materiales}</p>
        <div class="footer">
          Documento generado desde el catálogo digital del club · Tamaño Oficio (21.59 × 33.02 cm)
        </div>
        <script>window.onload = () => { setTimeout(()=>window.print(), 300); };<\/script>
      </body>
      </html>
    `);
    win.document.close();
  }

  function slugify(texto) {
    return texto.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '_')
      .replace(/^_+|_+$/g, '')
      .substring(0, 40);
  }

  document.getElementById('btnWord').addEventListener('click', exportWord);
  document.getElementById('btnPdf').addEventListener('click', exportPdf);

  renderGrid();
  </script>
</body>
</html>
